<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Karyawan</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --success: #10b981;
            --bg-page: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        input[readonly] {
            background-color: #f9fafb;
            color: var(--text-muted);
        }

        .camera-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
            display: none;
            aspect-ratio: 4 / 3;
        }

        #videoElement, #photoPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: #a5b4fc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: var(--text-main);
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }

        .msg-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: none;
        }

        .msg-success {
            background-color: #ecfdf5;
            color: var(--success);
            border: 1px solid var(--success);
        }

        .msg-error {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .gps-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Absensi Online</h1>
            <p>Silakan lengkapi form absensi di bawah ini</p>
        </div>

        <div id="msgBox" class="msg-box"></div>

        <form id="absenForm">
            <div class="form-group">
                <label for="tipeAbsen">Tipe Absen</label>
                <select id="tipeAbsen" required>
                    <option value="IN">Masuk (IN)</option>
                    <option value="OUT">Pulang (OUT)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nikInput">NIK Karyawan</label>
                <input type="text" id="nikInput" placeholder="Masukkan NIK Anda..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="namaInput">Nama Karyawan</label>
                <input type="text" id="namaInput" placeholder="Nama otomatis terisi..." readonly required>
            </div>

            <div class="form-group" id="shiftGroup">
                <label for="shiftInput">Shift Kerja</label>
                <select id="shiftInput">
                    <option value="Pagi (Max 09:00)">Pagi (Max 09:00)</option>
                    <option value="Siang (Max 13:00)">Siang (Max 13:00)</option>
                    <option value="Middle (Max 11:00)">Middle (Max 11:00)</option>
                </select>
            </div>

            <div class="form-group" id="tokoGroup">
                <label for="tokoInput">Lokasi Toko</label>
                <select id="tokoInput">
                    <option value="">-- Pilih Toko --</option>
                </select>
                <div class="gps-status" id="gpsStatusText">Status GPS: Sedang melacak...</div>
            </div>

            <div class="form-group">
                <label>Verifikasi Wajah (Foto)</label>
                <div id="cameraArea" class="camera-container">
                    <video id="videoElement" autoplay playsinline></video>
                    <img id="photoPreview" src="" alt="Hasil Foto" style="display: none;">
                </div>
                <button type="button" class="btn btn-secondary" id="btnCapture">Ambil Foto</button>
            </div>

            <div class="form-group">
                <label for="keteranganInput">Keterangan (Opsional)</label>
                <textarea id="keteranganInput" rows="2" placeholder="Catatan opsional..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="btnSubmit">KIRIM ABSENSI</button>
        </form>
    </div>

    <script>
        // =====================================================================
        // KONFIGURASI URL APPS SCRIPT
        // =====================================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3pkeaiBt_Zph_ZYg00MblpB_3LroTUnZ0jTDr15qNq8z3TAfKiR_gxuUThdn-yhzCKQ/exec";

        // STATE GLOBAL
        let karyawanMap = {};
        let tokoList = [];
        let userGeoLocation = "";
        let currentFotoBase64 = "";
        let streamVideo = null;

        // ELEMEN DOM
        const form = document.getElementById('absenForm');
        const tipeAbsenElem = document.getElementById('tipeAbsen');
        const shiftGroup = document.getElementById('shiftGroup');
        const tokoGroup = document.getElementById('tokoGroup');
        const nikInput = document.getElementById('nikInput');
        const namaInput = document.getElementById('namaInput');
        const tokoInput = document.getElementById('tokoInput');
        const gpsStatusText = document.getElementById('gpsStatusText');
        const btnSubmit = document.getElementById('btnSubmit');
        const msgBox = document.getElementById('msgBox');

        // VIDEO & KAMERA
        const cameraArea = document.getElementById('cameraArea');
        const videoElement = document.getElementById('videoElement');
        const photoPreview = document.getElementById('photoPreview');
        const btnCapture = document.getElementById('btnCapture');

        // =====================================================================
        // INISIALISASI HALAMAN SAAT DIMUAT
        // =====================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            initGPS();
            await fetchInitialData();
            setupEventListeners();
        });

        // =====================================================================
        // PELACAKAN GPS AWAL
        // =====================================================================
        function initGPS() {
            if (!navigator.geolocation) {
                userGeoLocation = "Lokasi Tidak Diizinkan";
                gpsStatusText.innerText = "Status GPS: Browser tidak mendukung";
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userGeoLocation = `${pos.coords.latitude}, ${pos.coords.longitude}`;
                    gpsStatusText.innerText = "Status GPS: Terkunci (Aktif)";
                },
                (err) => {
                    console.warn("GPS awal gagal:", err);
                    userGeoLocation = "Lokasi Tidak Diizinkan";
                    gpsStatusText.innerText = "Status GPS: Belum aktif / Tidak diizinkan";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // ASYNC HELPER: AMBIL GPS TERBARU SECARA PAKSA SAAT KLIK SUBMIT
        function getCurrentLocationAsync() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        resolve(`${lat}, ${lng}`);
                    },
                    (error) => {
                        console.warn("GPS Error saat kirim:", error);
                        resolve(null);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // =====================================================================
        // AMBIL DATA KARYAWAN & TOKO DARI GOOGLE APPS SCRIPT
        // =====================================================================
        async function fetchInitialData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                if (data.status === "success") {
                    // Peta data karyawan (NIK -> Nama)
                    karyawanMap = data.karyawan || {};
                    
                    // List toko
                    tokoList = data.toko || [];
                    tokoInput.innerHTML = '<option value="">-- Pilih Toko --</option>';
                    tokoList.forEach(toko => {
                        const kode = toko.kode || toko.Kode || toko['Nama Store'] || '';
                        const nama = toko.namaToko || toko['Nama Toko'] || kode;
                        if (kode) {
                            const opt = document.createElement('option');
                            opt.value = kode;
                            opt.textContent = `${kode} - ${nama}`;
                            tokoInput.appendChild(opt);
                        }
                    });
                }
            } catch (error) {
                console.error("Gagal memuat data master:", error);
                showMsg("⚠️ Gagal memuat data Toko & Karyawan dari server. Coba refresh halaman.", "error");
            }
        }

        // =====================================================================
        // EVENT LISTENER
        // =====================================================================
        function setupEventListeners() {
            // Sembunyikan field Shift & Toko jika Tipe Absen OUT
            tipeAbsenElem.addEventListener('change', () => {
                if (tipeAbsenElem.value === 'OUT') {
                    shiftGroup.style.display = 'none';
                    tokoGroup.style.display = 'none';
                } else {
                    shiftGroup.style.display = 'block';
                    tokoGroup.style.display = 'block';
                }
            });

            // Auto-fill Nama berdasarkan NIK
            nikInput.addEventListener('input', () => {
                const nik = nikInput.value.trim();
                namaInput.value = karyawanMap[nik] || "";
            });

            // Tombol Ambil Foto / Ulangi Foto
            btnCapture.addEventListener('click', toggleCamera);

            // Tombol Kirim Absensi
            form.addEventListener('submit', handleAbsenSubmit);
        }

        // =====================================================================
        // LOGIKA KAMERA & AMBIL FOTO
        // =====================================================================
        async function toggleCamera() {
            // Jika sedang preview foto, ubah tombol kembali untuk ambil ulang
            if (photoPreview.style.display === 'block') {
                photoPreview.style.display = 'none';
                videoElement.style.display = 'block';
                btnCapture.innerText = "Jepret Foto";
                await startCamera();
                return;
            }

            // Jika kamera belum nyala, hidupkan kamera
            if (!streamVideo) {
                await startCamera();
                return;
            }

            // Jepret gambar dari video streams
            const canvas = document.createElement('canvas');
            canvas.width = videoElement.videoWidth || 640;
            canvas.height = videoElement.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            currentFotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            photoPreview.src = currentFotoBase64;
            
            // Tampilkan Preview
            videoElement.style.display = 'none';
            photoPreview.style.display = 'block';
            btnCapture.innerText = "Ambil Ulang Foto";

            stopCamera();
        }

        async function startCamera() {
            try {
                cameraArea.style.display = 'block';
                videoElement.style.display = 'block';
                photoPreview.style.display = 'none';
                btnCapture.innerText = "Jepret Foto";

                streamVideo = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });
                videoElement.srcObject = streamVideo;
            } catch (err) {
                alert("❌ Tidak dapat mengakses kamera! Pastikan izin kamera telah diberikan pada browser.");
            }
        }

        function stopCamera() {
            if (streamVideo) {
                streamVideo.getTracks().forEach(track => track.stop());
                streamVideo = null;
            }
        }

        // =====================================================================
        // HELPER: PERHITUNGAN JARAK ANTARA 2 TITIK (HAVERSINE FORMULA)
        // =====================================================================
        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Radius Bumi (meter)
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function deg2rad(deg) {
            return deg * (Math.PI/180);
        }

        // =====================================================================
        // HELPER: MEMBACA KOORDINAT TOKO SECARA FLEKSIBEL
        // =====================================================================
        function getStoreLatLng(tokoObj) {
            if (!tokoObj) return null;

            // Cek properti Latitude & Longitude (termasuk besar/kecil huruf header)
            const lat = parseFloat(tokoObj.latitude || tokoObj.Latitude || tokoObj.lat || tokoObj.Lat);
            const lng = parseFloat(tokoObj.longitude || tokoObj.Longitude || tokoObj.lng || tokoObj.Lng);

            if (!isNaN(lat) && !isNaN(lng)) {
                return { lat: lat, lng: lng };
            }

            // Alternatif jika koordinat ditulis gabung di 1 kolom (contoh: "-6.8353, 107.928133")
            const lokasiStr = tokoObj.lokasi || tokoObj.Lokasi || tokoObj.koordinat || tokoObj.Koordinat || "";
            if (lokasiStr) {
                const parts = lokasiStr.split(',').map(n => parseFloat(n.trim()));
                if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                    return { lat: parts[0], lng: parts[1] };
                }
            }

            return null;
        }

        // =====================================================================
        // FUNGSI UTAMA: KIRIM DATA ABSENSI KE SERVER
        // =====================================================================
        async function handleAbsenSubmit(e) {
            e.preventDefault();

            const tipeAbsen = tipeAbsenElem.value;
            const nikVal = nikInput.value.trim();
            const namaVal = namaInput.value.trim();

            // 1. VALIDASI NIK TERDAFTAR DI DATABASE
            if (!nikVal || !karyawanMap[nikVal] || namaVal === "") {
                alert("❌ NIK tidak terdaftar! Silakan periksa kembali NIK Anda.");
                nikInput.focus();
                return;
            }

            // 2. VALIDASI FOTO WAJIB (UNTUK IN & OUT)
            if ((tipeAbsen === 'IN' || tipeAbsen === 'OUT') && !currentFotoBase64) {
                alert("📸 Silakan ambil foto verifikasi terlebih dahulu!");
                return;
            }

            // Status tombol loading sementara pelacakan GPS
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Mengecek GPS...";

            // 3. PAKSA AMBIL GPS TERKINI SECARA REAL-TIME
            let freshLocation = await getCurrentLocationAsync();
            if (freshLocation) {
                userGeoLocation = freshLocation;
                gpsStatusText.innerText = "Status GPS: Terkunci (Aktif)";
            }

            // 4. VALIDASI GEOFENCING (1.000 METER / 1 KM) KHUSUS ABSEN MASUK (IN)
            if (tipeAbsen === 'IN') {
                if (!userGeoLocation || userGeoLocation === "Lokasi Tidak Diizinkan") {
                    alert("📍 GPS TIDAK AKTIF / DITOLAK!\n\nMohon aktifkan GPS (Lokasi) di HP Anda dan izinkan akses lokasi pada browser untuk meneruskan absensi.");
                    resetSubmitButton();
                    return;
                }

                const selectedKode = tokoInput.value;
                const selectedTokoObj = tokoList.find(t => 
                    (t.namaToko || t['Nama Toko'] || t.kode || t['Nama Store'] || t.Kode) === selectedKode
                );

                if (!selectedTokoObj) {
                    alert("❌ Silakan pilih toko terlebih dahulu!");
                    resetSubmitButton();
                    return;
                }

                const storeCoords = getStoreLatLng(selectedTokoObj);

                if (!storeCoords) {
                    alert(`⚠️ Data koordinat toko (${selectedKode}) tidak terbaca dari Google Sheets!\nPastikan kolom Latitude & Longitude pada tab Toko terisi angka.`);
                    resetSubmitButton();
                    return;
                }

                const userCoords = userGeoLocation.split(',').map(n => parseFloat(n.trim()));
                if (userCoords.length !== 2 || isNaN(userCoords[0]) || isNaN(userCoords[1])) {
                    alert("📍 Gagal membaca titik GPS HP Anda. Pastikan GPS aktif lalu coba refresh halaman.");
                    resetSubmitButton();
                    return;
                }

                // Hitung jarak (dalam meter)
                const distanceMeters = getDistanceFromLatLonInMeters(
                    userCoords[0], userCoords[1],
                    storeCoords.lat, storeCoords.lng
                );

                // BLOKIR JIKA RADIUS DI ATAS 1.000 METER (1 KM)
                if (distanceMeters > 1000) {
                    const distanceKm = (distanceMeters / 1000).toFixed(2);
                    alert(`⛔ Lokasi Anda tidak sesuai!\n\nJarak Anda saat ini: ±${distanceKm} km (${Math.round(distanceMeters)} meter) dari toko.\nBatas maksimum yang diizinkan adalah 1 km.`);
                    resetSubmitButton();
                    return;
                }
            }

            // 5. SUSUN DATA PAYLOAD
            const payload = {
                nik: nikVal,
                nama: namaVal,
                tipeAbsen: tipeAbsen,
                shift: tipeAbsen === 'IN' ? document.getElementById('shiftInput').value : "-",
                toko: tipeAbsen === 'IN' ? document.getElementById('tokoInput').value : "-",
                foto: currentFotoBase64 || "-",
                lokasi: userGeoLocation || "Online Web",
                keterangan: document.getElementById('keteranganInput').value.trim()
            };

            // 6. PROSES KIRIM KE APPS SCRIPT
            try {
                btnSubmit.innerText = "Mengirim...";
                msgBox.style.display = "none";

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showMsg("✅ Absensi Berhasil Disimpan!", "success");
                    setTimeout(() => { location.reload(); }, 1500);
                } else {
                    throw new Error(result.message || "Gagal menyimpan absensi.");
                }

            } catch (err) {
                console.error("Error submitting:", err);
                showMsg("❌ Koneksi Terputus / Gagal Mengirim. Coba lagi!", "error");
            } finally {
                resetSubmitButton();
            }
        }

        // =====================================================================
        // HELPER FUNGSI LAINNYA
        // =====================================================================
        function resetSubmitButton() {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "KIRIM ABSENSI";
        }

        function showMsg(text, type) {
            msgBox.textContent = text;
            msgBox.className = `msg-box msg-${type}`;
            msgBox.style.display = "block";
        }
    </script>
</body>
</html>
