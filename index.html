<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Kehadiran UPT</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; text-align: center; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        textarea { resize: vertical; font-family: Arial, sans-serif; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        #video { width: 100%; max-width: 400px; border-radius: 8px; transform: scaleX(-1); }
        #status { font-weight: bold; color: blue; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Form Absen UPT</h2>
    
    <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required>
    
    <select id="shift">
        <option value="">-- Pilih Shift --</option>
        <option value="Pagi">Pagi</option>
        <option value="Siang">Siang</option>
        <option value="Malam">Malam</option>
    </select>

    <select id="toko">
        <option value="">-- Pilih Lokasi Toko --</option>
        <option value="Toko Kedaton">Toko Kedaton</option>
        <option value="Toko Sudirman">Toko Sudirman</option>
        <option value="Toko Ahmad Yani">Toko Ahmad Yani</option>
    </select>

    <!-- Kolom Keterangan Tambahan (Perbantuan/Jam Pendek) -->
    <textarea id="keterangan" rows="2" placeholder="Keterangan (Opsional: Perbantuan Toko X, Jam Pendek, dll)"></textarea>

    <p>Konfirmasi Kamera & GPS:</p>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <button type="button" id="btnAbsen" onclick="prosesAbsensi()">KIRIM ABSENSI</button>
    <div id="status"></div>

    <script>
        // MASUKKAN URL WEB APP DARI GOOGLE APPS SCRIPT ANDA DI BAWAH INI
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyRYWAB4MqM3kImdoWRahIe2-SlmlZcy2P9aGobRcmzy_EIEM-hD0-EvSvK0smdaJCtXQ/exec";

        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');

        // Membuka kamera depan HP karyawan secara otomatis saat memuat situs
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal akses kamera. Pastikan izin kamera aktif!"); });

        function prosesAbsensi() {
            const nama = document.getElementById('nama').value;
            const shift = document.getElementById('shift').value;
            const toko = document.getElementById('toko').value;
            const keterangan = document.getElementById('keterangan').value;

            if (!nama || !shift || !toko) {
                alert("Kolom Nama, Shift, dan Toko wajib diisi!");
                return;
            }

            statusDiv.innerText = "Mengambil lokasi GPS...";
            document.getElementById('btnAbsen').disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(5);
                        const lon = position.coords.longitude.toFixed(5);
                        const koordinat = `${lat}, ${lon}`;
                        
                        cetakWatermarkDanKirim(nama, shift, toko, koordinat, keterangan);
                    },
                    (error) => {
                        alert("Gagal mengambil GPS. Izin lokasi wajib diaktifkan!");
                        document.getElementById('btnAbsen').disabled = false;
                        statusDiv.innerText = "";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Browser tidak mendukung sistem GPS.");
                document.getElementById('btnAbsen').disabled = false;
            }
        }

        function cetakWatermarkDanKirim(nama, shift, toko, koordinat, keterangan) {
            statusDiv.innerText = "Memproses foto bukti...";
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // Transformasi efek cermin kamera depan agar hasil foto natural
            ctx.translate(640, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 640, 480);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset data transformasi

            // Generate teks watermark waktu & GPS saat itu juga
            const waktu = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
            const teksWatermark = `${waktu} | GPS: ${koordinat}`;

            // Cetak latar belakang hitam transparan untuk menjaga readability teks
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 430, 640, 50);

            // Tulis Teks Watermark berwarna kuning cerah
            ctx.font = "bold 18px Arial";
            ctx.fillStyle = "yellow";
            ctx.fillText(teksWatermark, 15, 462);

            // Ekstrak canvas ke string format gambar Base64 JPEG
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);

            statusDiv.innerText = "Mengirim data ke database...";

            // Kirim Payload JSON menuju Google Web App via HTTP POST
            fetch(URL_GOOGLE_SCRIPT, {
                method: "POST",
                body: JSON.stringify({
                    nama: nama,
                    shift: shift,
                    toko: toko,
                    lokasi: koordinat,
                    keterangan: keterangan,
                    foto: fotoBase64
                })
            })
            .then(res => res.json())
            .then(respons => {
                if(respons.status === "success") {
                    statusDiv.innerHTML = "<span style='color:green;'>Absen Berhasil Dicatat! Terima Kasih.</span>";
                    document.getElementById('nama').value = "";
                    document.getElementById('keterangan').value = "";
                } else {
                    statusDiv.innerHTML = "<span style='color:red;'>Gagal: " + respons.message + "</span>";
                }
                document.getElementById('btnAbsen').disabled = false;
            })
            .catch(err => {
                statusDiv.innerHTML = "<span style='color:red;'>Terjadi kesalahan jaringan!</span>";
                document.getElementById('btnAbsen').disabled = false;
            });
        }
    </script>
</body>
</html>
