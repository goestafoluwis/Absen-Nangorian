<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Karyawan</title>
    <!-- Menggunakan Font Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. UI / CSS STYLING (MODERN & ELEGAN)
           ========================================================================== */
        :root {
            --primary-color: #2563eb; /* Biru Modern */
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px 15px;
            color: var(--text-main);
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Styling Tombol */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 10px;
        }

        button:disabled {
            background-color: #9ca3af !important;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        .btn-camera {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-camera:hover:not(:disabled) { background-color: #d1d5db; }
        
        .btn-retake {
            background-color: #ef4444;
            color: white;
            display: none;
        }

        .btn-retake:hover:not(:disabled) { background-color: #dc2626; }

        .btn-superior {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            margin-top: 30px;
        }

        .btn-superior:hover {
            background-color: #eff6ff;
        }

        /* Area Kamera */
        #camera-container {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: #111;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
        }
        video { width: 100%; display: block; }
        canvas { display: none; }
        #preview { width: 100%; display: none; border-radius: 10px; }

        /* Pesan Notifikasi */
        .msg-box {
            padding: 15px;
            border-radius: 10px;
            display: none;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
        .msg-box.success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .msg-box.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* Area Admin / Superior */
        #superiorArea {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px dashed var(--border-color);
        }
        
        .superior-header {
            text-align: center; 
            color: var(--text-main); 
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">Sistem Absensi</h2>
    <div id="msgBox" class="msg-box"></div>

    <!-- FORM UTAMA ABSENSI -->
    <form id="absenForm">
        
        <div class="form-group">
            <label>Tipe Absensi</label>
            <select id="tipeAbsen" onchange="toggleFormInputs()">
                <option value="IN">Absen Masuk (IN)</option>
                <option value="OUT">Absen Pulang (OUT)</option>
                <!-- DITAMBAHKAN KEMBALI: Day Off & Cuti -->
                <option value="Day Off">Day Off</option>
                <option value="Cuti">Cuti</option>
            </select>
        </div>

        <div class="form-group">
            <label>NIK Karyawan</label>
            <input type="text" id="nikInput" placeholder="Contoh: 12345" required>
        </div>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaInput" placeholder="Masukkan Nama Anda" required>
        </div>

        <!-- Bagian Input Ekstra (Hanya untuk IN) -->
        <div id="extraInputs">
            <div class="form-group">
                <label>Shift</label>
                <select id="shiftInput">
                    <option value="Pagi">Pagi (Max 09:00)</option>
                    <option value="Middle">Middle</option>
                    <option value="Siang">Siang</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lokasi Toko</label>
                <!-- NAMA TOKO DIPERBAIKI -->
                <select id="tokoInput">
                    <option value="">-- Pilih Toko --</option>
                    <option value="ASMD">ASMD - Plaza Asia Sumedang</option>
                    <option value="XMDG">XMDG - FS Ruko Tanjung</option>
                </select>
            </div>
        </div>

        <!-- Bagian Kamera (Disembunyikan jika Cuti / Day Off) -->
        <div id="cameraSection" class="form-group">
            <label>Verifikasi Wajah (Selfie)</label>
            <div id="camera-container">
                <video id="video" autoplay playsinline></video>
                <img id="preview" alt="Hasil Foto">
                <canvas id="canvas"></canvas>
            </div>
            <button type="button" id="btnCapture" class="btn-camera" onclick="takeSnapshot()">📸 Ambil Foto</button>
            <button type="button" id="btnRetake" class="btn-retake" onclick="retakePhoto()">🔄 Ambil Ulang</button>
        </div>

        <div class="form-group">
            <label>Keterangan (Opsional)</label>
            <input type="text" id="keteranganInput" placeholder="Tambahkan catatan jika perlu...">
        </div>

        <button type="submit" id="btnSubmit" class="btn-primary">KIRIM ABSENSI</button>
    </form>

    <!-- TOMBOL MENU SUPERIOR / ADMIN -->
    <button type="button" id="btnSuperior" class="btn-superior" onclick="toggleSuperiorMenu()">
        🔒 Monitoring Superior
    </button>

    <!-- AREA MONITORING SUPERIOR -->
    <div id="superiorArea">
        <h3 class="superior-header">Akses Admin</h3>
        <p style="text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
            Masukkan PIN rahasia untuk melihat rekap absensi.
        </p>
        
        <div class="form-group">
            <input type="password" id="pinSuperior" placeholder="PIN Superior...">
        </div>
        <button type="button" class="btn-primary" onclick="loginSuperior()">Masuk Dashboard</button>
    </div>
</div>

<script>
    /* ==========================================================================
       1. KONFIGURASI & VARIABEL GLOBAL
       ========================================================================== */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3pkeaiBt_Zph_ZYg00MblpB_3LroTUnZ0jTDr15qNq8z3TAfKiR_gxuUThdn-yhzCKQ/exec"; // GANTI DENGAN LINK WEB APP GAS ANDA
    
    let currentFotoBase64 = null;
    let userGeoLocation = null;
    let videoStream = null;

    // Data Karyawan (Contoh Dummy)
    const karyawanMap = {
        "12345": "Luwis Goestafo",
        "67890": "Nama Karyawan Lain"
    };

    // Data Toko (Pastikan Latitude & Longitude sesuai)
    const tokoList = [
        { kode: "ASMD", "Nama Toko": "Plaza Asia Sumedang", latitude: -6.8353, longitude: 107.928133 },
        { kode: "XMDG", "Nama Toko": "FS Ruko Tanjung", latitude: -6.9061469, longitude: 107.7973664 }
    ];

    /* ==========================================================================
       2. FUNGSI INISIALISASI (KAMERA & FORM)
       ========================================================================== */
    window.onload = () => {
        initCamera();
        document.getElementById('absenForm').addEventListener('submit', handleAbsenSubmit);
        toggleFormInputs(); // Jalankan sekali saat load
    };

    // LOGIKA MENYEMBUNYIKAN FORM BERDASARKAN TIPE ABSEN
    function toggleFormInputs() {
        const tipe = document.getElementById('tipeAbsen').value;
        const extra = document.getElementById('extraInputs');
        const cameraSec = document.getElementById('cameraSection');

        if (tipe === 'IN') {
            // Absen Masuk: Butuh Toko, Shift, dan Foto
            extra.style.display = 'block';
            cameraSec.style.display = 'block';
        } else if (tipe === 'OUT') {
            // Absen Pulang: Hanya butuh Foto, tidak butuh pilih Toko/Shift
            extra.style.display = 'none';
            cameraSec.style.display = 'block';
        } else {
            // Day Off / Cuti: Tidak butuh pilih Toko/Shift, Tidak butuh Foto Selfie
            extra.style.display = 'none';
            cameraSec.style.display = 'none';
        }
    }

    /* ==========================================================================
       3. LOGIKA KAMERA & FOTO
       ========================================================================== */
    async function initCamera() {
        const video = document.getElementById('video');
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = videoStream;
        } catch (err) {
            console.warn("Kamera tidak terdeteksi / izin ditolak.");
            // Tidak perlu alert keras agar tidak mengganggu jika karyawan sedang Day Off/Cuti
        }
    }

    function takeSnapshot() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const btnCapture = document.getElementById('btnCapture');
        const btnRetake = document.getElementById('btnRetake');

        if (!videoStream) {
            alert("⚠️ Kamera belum siap atau izin ditolak browser!");
            return;
        }

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        currentFotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
        preview.src = currentFotoBase64;

        video.style.display = 'none';
        preview.style.display = 'block';
        btnCapture.style.display = 'none';
        btnRetake.style.display = 'block';
    }

    function retakePhoto() {
        const video = document.getElementById('video');
        const preview = document.getElementById('preview');
        const btnCapture = document.getElementById('btnCapture');
        const btnRetake = document.getElementById('btnRetake');

        currentFotoBase64 = null;
        preview.style.display = 'none';
        video.style.display = 'block';
        btnRetake.style.display = 'none';
        btnCapture.style.display = 'block';
    }

    /* ==========================================================================
       4. LOGIKA FITUR SUPERIOR / ADMIN
       ========================================================================== */
    function toggleSuperiorMenu() {
        const area = document.getElementById('superiorArea');
        if (area.style.display === 'none' || area.style.display === '') {
            area.style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } else {
            area.style.display = 'none';
        }
    }

    function loginSuperior() {
        const pin = document.getElementById('pinSuperior').value;
        if (pin === "1234") { // Ganti "1234" dengan PIN rahasia Anda
            alert("✅ Login Berhasil!");
            // window.location.href = "LINK_SPREADSHEET_SUPERIOR_ANDA"; 
        } else {
            alert("❌ PIN Salah! Silakan coba lagi.");
        }
    }

    /* ==========================================================================
       5. HELPER GPS & KOORDINAT (SUDAH DIPERBAIKI ANTI-ERROR SHEET)
       ========================================================================== */
    function getCurrentLocationAsync() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => resolve(`${position.coords.latitude}, ${position.coords.longitude}`),
                (error) => resolve(null),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    function getStoreLatLng(tokoObj) {
        if (!tokoObj) return null;

        function parseCoord(val) {
            if (val === undefined || val === null || val === '') return NaN;
            let strVal = String(val).replace(',', '.').trim(); // Antisipasi koma dari Sheet
            return parseFloat(strVal);
        }

        const lat = parseCoord(tokoObj['Latitude'] || tokoObj.latitude || tokoObj.Latitude || tokoObj.lat);
        const lng = parseCoord(tokoObj['Longitude'] || tokoObj.longitude || tokoObj.Longitude || tokoObj.lng);

        if (!isNaN(lat) && !isNaN(lng)) return { lat: lat, lng: lng };

        const lokasiStr = tokoObj['Lokasi'] || tokoObj.lokasi || tokoObj.koordinat || "";
        if (lokasiStr) {
            const parts = String(lokasiStr).split(',').map(n => parseCoord(n));
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                return { lat: parts[0], lng: parts[1] };
            }
        }
        return null;
    }

    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    /* ==========================================================================
       6. LOGIKA UTAMA SUBMIT ABSENSI
       ========================================================================== */
    async function handleAbsenSubmit(e) {
        e.preventDefault();

        const msgBox = document.getElementById('msgBox');
        const btnSubmit = document.getElementById('btnSubmit');
        const tipeAbsen = document.getElementById('tipeAbsen').value;
        const nikInput = document.getElementById('nikInput').value.trim();
        const namaInput = document.getElementById('namaInput').value.trim();

        // Validasi NIK Kosong
        if (!nikInput || namaInput === "") {
            alert("❌ NIK dan Nama harus diisi!");
            return;
        }

        // Cek Foto WAJIB jika IN atau OUT
        if ((tipeAbsen === 'IN' || tipeAbsen === 'OUT') && !currentFotoBase64) {
            alert("📸 Silakan ambil foto selfie absensi terlebih dahulu!");
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerText = "Memproses...";

        // Ambil GPS (Hanya wajib di-cek strict jika Absen IN)
        let freshLocation = await getCurrentLocationAsync();
        if (freshLocation) userGeoLocation = freshLocation;

        // LOGIKA GEOFENCING (HANYA BERLAKU JIKA ABSEN IN)
        if (tipeAbsen === 'IN') {
            if (!userGeoLocation) {
                alert("📍 GPS TIDAK AKTIF!\n\nMohon nyalakan GPS di HP Anda dan izinkan browser mengakses lokasi.");
                resetSubmitButton(btnSubmit);
                return;
            }

            const selectedKode = document.getElementById('tokoInput').value;
            if (!selectedKode) {
                alert("❌ Silakan pilih lokasi toko!");
                resetSubmitButton(btnSubmit);
                return;
            }

            // PENCARIAN TOKO DIPERBAIKI
            const selectedTokoObj = tokoList.find(t => 
                (t['Nama Toko'] || t.namaToko || t.kode || t.Kode) === selectedKode
            );

            const storeCoords = getStoreLatLng(selectedTokoObj);
            if (!storeCoords) {
                alert(`⚠️ Data koordinat untuk toko ${selectedKode} gagal terbaca. Hubungi Admin.`);
                resetSubmitButton(btnSubmit);
                return;
            }

            const userCoords = userGeoLocation.split(',').map(n => parseFloat(n.trim()));
            if (userCoords.length !== 2 || isNaN(userCoords[0]) || isNaN(userCoords[1])) {
                alert("📍 Gagal membaca titik GPS Anda.");
                resetSubmitButton(btnSubmit);
                return;
            }

            // Hitung Jarak
            const distanceMeters = getDistanceFromLatLonInMeters(
                userCoords[0], userCoords[1], storeCoords.lat, storeCoords.lng
            );

            // Batas 1 KM (1000 meter)
            if (distanceMeters > 1000) {
                const distanceKm = (distanceMeters / 1000).toFixed(2);
                alert(`⛔ ANDA BERADA DI LUAR RADIUS TOKO!\n\nJarak Anda saat ini: ±${distanceKm} km (${Math.round(distanceMeters)} meter).\nMaksimal absen adalah 1 km dari titik toko.`);
                resetSubmitButton(btnSubmit);
                return;
            }
        }

        // BUNGKUS PAYLOAD DATA
        const payload = {
            nik: nikInput,
            nama: namaInput,
            tipeAbsen: tipeAbsen,
            shift: tipeAbsen === 'IN' ? document.getElementById('shiftInput').value : "-",
            toko: tipeAbsen === 'IN' ? document.getElementById('tokoInput').value : "-",
            foto: currentFotoBase64 || "-",
            lokasi: userGeoLocation || "Tidak Terlacak",
            keterangan: document.getElementById('keteranganInput').value.trim()
        };

        try {
            btnSubmit.innerText = "Mengirim Data...";
            msgBox.style.display = "none";

            if(SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE"){
                throw new Error("Link Script URL belum dimasukkan pada kode HTML.");
            }

            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === 'success') {
                showMsg(`✅ Absensi ${tipeAbsen} Berhasil Disimpan!`, "success");
                setTimeout(() => { location.reload(); }, 2000); 
            } else {
                throw new Error(result.message || "Gagal menyimpan data absensi.");
            }

        } catch (err) {
            console.error("Error submitting:", err);
            showMsg(`❌ Gagal Mengirim: ${err.message}`, "error");
        } finally {
            resetSubmitButton(btnSubmit);
        }
    }

    function showMsg(message, type) {
        const msgBox = document.getElementById('msgBox');
        msgBox.innerText = message;
        msgBox.className = `msg-box ${type}`;
        msgBox.style.display = 'block';
    }

    function resetSubmitButton(btn) {
        if (btn) {
            btn.disabled = false;
            btn.innerText = "KIRIM ABSENSI";
        }
    }
</script>

</body>
</html>
