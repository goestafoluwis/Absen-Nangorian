<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Geofencing</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fafafa;
        }
        input:read-only {
            background-color: #e9ecef;
            color: #495057;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }
        .btn-primary { background-color: #3f51b5; color: white; }
        .btn-primary:hover:not(:disabled) { background-color: #303f9f; }
        .btn-camera { background-color: #e0e0e0; color: #333; }
        .btn-retake { background-color: #f44336; color: white; display: none; }
        .btn-superior {
            background-color: transparent;
            color: #3f51b5;
            border: 2px solid #3f51b5;
            margin-top: 25px;
        }

        #camera-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 10px;
        }
        video { width: 100%; display: block; }
        canvas { display: none; }
        #preview { width: 100%; display: none; border-radius: 8px; }

        .msg-box {
            padding: 12px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .msg-box.success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .msg-box.error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        /* TAB SUPERIOR / ADMIN */
        #superiorSection {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 8px; text-align: left; }
        th { background-color: #3f51b5; color: white; }
        .img-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Absensi</h2>
    <div id="msgBox" class="msg-box"></div>

    <!-- FORM UTAMA ABSENSI -->
    <form id="absenForm">
        <div class="form-group">
            <label>Tipe Absen</label>
            <select id="tipeAbsen" onchange="toggleFormMode()">
                <option value="IN">Absen Masuk (IN)</option>
                <option value="OUT">Absen Pulang (OUT)</option>
                <option value="Day Off">Day Off</option>
                <option value="Cuti">Cuti</option>
            </select>
        </div>

        <div class="form-group">
            <label>NIK Karyawan</label>
            <input type="text" id="nikInput" placeholder="Ketik NIK Anda..." oninput="autoFillNama()" required>
        </div>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaInput" placeholder="Nama otomatis muncul..." readonly required>
        </div>

        <!-- Group Input Khusus Absen IN -->
        <div id="groupAbsenIn">
            <div class="form-group">
                <label>Shift</label>
                <select id="shiftInput">
                    <option value="Pagi (max jam 09.00)">Pagi (max jam 09.00)</option>
                    <option value="Middle (max jam 11.00)">Middle (max jam 11.00)</option>
                    <option value="Siang (max jam 14.00)">Siang (max jam 14.00)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lokasi Toko</label>
                <select id="tokoInput">
                    <option value="">-- Memuat Daftar Toko... --</option>
                </select>
            </div>
        </div>

        <!-- Group Kamera (Untuk IN dan OUT) -->
        <div class="form-group" id="cameraGroup">
            <label>Verifikasi Wajah (Foto Selfie)</label>
            <div id="camera-container">
                <video id="video" autoplay playsinline></video>
                <img id="preview" alt="Hasil Foto">
                <canvas id="canvas"></canvas>
            </div>
            <button type="button" id="btnCapture" class="btn-camera" onclick="takeSnapshot()">📸 Ambil Foto</button>
            <button type="button" id="btnRetake" class="btn-retake" onclick="retakePhoto()">🔄 Ambil Ulang Foto</button>
        </div>

        <div class="form-group">
            <label>Keterangan (Opsional)</label>
            <input type="text" id="keteranganInput" placeholder="Catatan opsional...">
        </div>

        <button type="submit" id="btnSubmit" class="btn-primary">KIRIM ABSENSI</button>
    </form>

    <!-- TOMBOL MENU SUPERIOR / ADMIN -->
    <button type="button" class="btn-superior" onclick="toggleSuperiorLogin()">
        🔒 Akses Superior / Admin
    </button>

    <!-- AREA SUPERIOR & MONITORING -->
    <div id="superiorSection">
        <h3>Monitoring Kehadiran Staff</h3>
        
        <!-- Form Login Password Admin -->
        <div id="loginAdminBox">
            <div class="form-group">
                <label>Kata Sandi Admin/Superior</label>
                <input type="password" id="passAdmin" placeholder="Masukkan kata sandi...">
            </div>
            <button type="button" class="btn-primary" onclick="authAdmin()">Masuk Dashboard</button>
        </div>

        <!-- Dashboard Monitoring Data (Akan terbuka setelah password benar) -->
        <div id="dashboardAdmin" style="display: none;">
            <button type="button" class="btn-camera" onclick="loadMonitoringData()" style="margin-bottom: 10px;">🔄 Refresh Data</button>
            <div class="table-responsive">
                <table id="tabelAbsensi">
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Nama / NIK</th>
                            <th>Tipe</th>
                            <th>Foto</th>
                            <th>Lokasi</th>
                        </tr>
                    </thead>
                    <tbody id="dataMonitoring">
                        <tr><td colspan="5" style="text-align:center;">Klik Refresh Data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    /* ==========================================================================
       1. KONFIGURASI LINK APPS SCRIPT
       ========================================================================== */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3pkeaiBt_Zph_ZYg00MblpB_3LroTUnZ0jTDr15qNq8z3TAfKiR_gxuUThdn-yhzCKQ/exec"; 

    let currentFotoBase64 = null;
    let userGeoLocation = null;
    let videoStream = null;
    
    // Database Internal sementara (Di-fetch otomatis dari Google Sheet saat load)
    let databaseKaryawan = {};
    let databaseToko = [];

    window.onload = () => {
        initCamera();
        fetchDatabaseSheets();
        toggleFormMode();
        document.getElementById('absenForm').addEventListener('submit', handleAbsenSubmit);
    };

    /* ==========================================================================
       2. LOAD DATABASE DARILINK SPREADSHEET (data_karyawan & data_toko)
       ========================================================================== */
    async function fetchDatabaseSheets() {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=getInitialData`);
            const data = await response.json();
            
            if(data.karyawan) databaseKaryawan = data.karyawan;
            if(data.toko) {
                databaseToko = data.toko;
                renderDropdownToko(data.toko);
            }
        } catch (err) {
            console.error("Gagal load database:", err);
        }
    }

    function renderDropdownToko(listToko) {
        const select = document.getElementById('tokoInput');
        select.innerHTML = '<option value="">-- Pilih Toko --</option>';
        listToko.forEach(item => {
            // Format: Kode Toko - Nama Toko
            const optionText = `${item.kode} - ${item.namaToko}`;
            select.innerHTML += `<option value="${item.kode}">${optionText}</option>`;
        });
    }

    /* ==========================================================================
       3. AUTOFILL NAMA BERDASARKAN NIK
       ========================================================================== */
    function autoFillNama() {
        const nik = document.getElementById('nikInput').value.trim();
        const namaInput = document.getElementById('namaInput');

        if (databaseKaryawan[nik]) {
            namaInput.value = databaseKaryawan[nik];
        } else {
            namaInput.value = "";
        }
    }

    /* ==========================================================================
       4. LOGIKA PENGATURAN TIPE ABSEN (IN, OUT, DAY OFF, CUTI)
       ========================================================================== */
    function toggleFormMode() {
        const tipe = document.getElementById('tipeAbsen').value;
        const groupIn = document.getElementById('groupAbsenIn');
        const cameraGroup = document.getElementById('cameraGroup');

        if (tipe === 'IN') {
            groupIn.style.display = 'block';
            cameraGroup.style.display = 'block';
        } else if (tipe === 'OUT') {
            // OUT hanya minta Foto + GPS, tidak usah masukan shift / toko
            groupIn.style.display = 'none';
            cameraGroup.style.display = 'block';
        } else { 
            // Day Off & Cuti
            groupIn.style.display = 'none';
            cameraGroup.style.display = 'none';
        }
    }

    /* ==========================================================================
       5. KAMERA & GPS
       ========================================================================== */
    async function initCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video').srcObject = videoStream;
        } catch (err) {
            console.warn("Akses kamera ditolak / tidak tersedia.");
        }
    }

    function takeSnapshot() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        currentFotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
        preview.src = currentFotoBase64;

        video.style.display = 'none';
        preview.style.display = 'block';
        document.getElementById('btnCapture').style.display = 'none';
        document.getElementById('btnRetake').style.display = 'block';
    }

    function retakePhoto() {
        currentFotoBase64 = null;
        document.getElementById('preview').style.display = 'none';
        document.getElementById('video').style.display = 'block';
        document.getElementById('btnRetake').style.display = 'none';
        document.getElementById('btnCapture').style.display = 'block';
    }

    function getCurrentLocationAsync() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) resolve(null);
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`),
                (err) => resolve(null),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    }

    /* ==========================================================================
       6. SUBMIT ABSENSI
       ========================================================================== */
    async function handleAbsenSubmit(e) {
        e.preventDefault();

        const btn = document.getElementById('btnSubmit');
        const tipeAbsen = document.getElementById('tipeAbsen').value;
        const nik = document.getElementById('nikInput').value.trim();
        const nama = document.getElementById('namaInput').value.trim();

        if (!nama) {
            alert("❌ NIK tidak ditemukan di database data_karyawan!");
            return;
        }

        if ((tipeAbsen === 'IN' || tipeAbsen === 'OUT') && !currentFotoBase64) {
            alert("📸 Wajib mengambil foto selfie verifikasi!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Mengecek Lokasi GPS...";

        let locationStr = await getCurrentLocationAsync();

        const payload = {
            action: "submitAbsen",
            nik: nik,
            nama: nama,
            tipeAbsen: tipeAbsen,
            shift: tipeAbsen === 'IN' ? document.getElementById('shiftInput').value : "-",
            toko: tipeAbsen === 'IN' ? document.getElementById('tokoInput').value : "-",
            foto: currentFotoBase64 || "-",
            lokasi: locationStr || "GPS Tidak Aktif",
            timestamp: new Date().toLocaleString("id-ID"),
            keterangan: document.getElementById('keteranganInput').value.trim()
        };

        btn.innerText = "Mengirim Absensi...";

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const res = await response.json();
            if (res.status === 'success') {
                showMsg("✅ Absensi Berhasil Disimpan!", "success");
                setTimeout(() => location.reload(), 2000);
            } else {
                throw new Error(res.message);
            }
        } catch (err) {
            showMsg(`❌ Gagal: ${err.message}`, "error");
        } finally {
            btn.disabled = false;
            btn.innerText = "KIRIM ABSENSI";
        }
    }

    /* ==========================================================================
       7. LOGIKA MONITORING SUPERIOR & ADMIN
       ========================================================================== */
    function toggleSuperiorLogin() {
        const sec = document.getElementById('superiorSection');
        sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
    }

    function authAdmin() {
        const pass = document.getElementById('passAdmin').value;
        if (pass === "admin123") { // GANTI SANDI ADMIN DI SINI
            document.getElementById('loginAdminBox').style.display = 'none';
            document.getElementById('dashboardAdmin').style.display = 'block';
            loadMonitoringData();
        } else {
            alert("❌ Kata Sandi Salah!");
        }
    }

    async function loadMonitoringData() {
        const tbody = document.getElementById('dataMonitoring');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>';

        try {
            const response = await fetch(`${SCRIPT_URL}?action=getMonitoring`);
            const res = await response.json();

            if (res.data && res.data.length > 0) {
                tbody.innerHTML = '';
                res.data.reverse().forEach(row => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.timestamp}</td>
                            <td><b>${row.nama}</b><br><small>${row.nik}</small></td>
                            <td>${row.tipeAbsen}</td>
                            <td>${row.foto !== '-' ? `<img src="${row.foto}" class="img-thumb">` : '-'}</td>
                            <td><a href="https://maps.google.com/?q=${row.lokasi}" target="_blank">Lihat Map</a></td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data absensi hari ini.</td></tr>';
            }
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal mengambil data.</td></tr>';
        }
    }

    function showMsg(msg, type) {
        const box = document.getElementById('msgBox');
        box.innerText = msg;
        box.className = `msg-box ${type}`;
        box.style.display = 'block';
    }
</script>

</body>
</html>
