<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen Team Nangorian</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; text-align: center; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        textarea { resize: vertical; font-family: Arial, sans-serif; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #video { width: 100%; max-width: 400px; border-radius: 8px; transform: scaleX(-1); }
        #status { font-weight: bold; color: blue; margin-top: 10px; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Absen Team Nangorian</h2>
    
    <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required>

    <!-- Pilihan Absen Masuk / Keluar -->
    <select id="tipeAbsen">
        <option value="">-- Pilih Tipe Absen --</option>
        <option value="IN">Absen Masuk (IN)</option>
        <option value="OUT">Absen Keluar (OUT)</option>
    </select>
    
    <!-- Pilihan Shift Baru -->
    <select id="shift">
        <option value="">-- Pilih Shift --</option>
        <option value="Pagi">Pagi</option>
        <option value="Siang">Siang</option>
        <option value="Middle">Middle</option>
    </select>

    <!-- Dropdown Toko Singkat (ASMD, XMDG, dll) -->
    <select id="toko">
        <option value="">-- Memuat Daftar Toko... --</option>
    </select>

    <textarea id="keterangan" rows="2" placeholder="Keterangan (Opsional: Perbantuan Toko X, Jam Pendek, dll)"></textarea>

    <p>Konfirmasi Kamera & GPS:</p>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <button type="button" id="btnAbsen" onclick="prosesAbsensi()">KIRIM ABSENSI</button>
    <div id="status"></div>

    <script>
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbxMNUvOx4bK986Tg60h-toFNdDYRj7vYOTpHluyOGXcyJsnzZKyIwJq34ZKHldlEJdlGw/exec";

        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const selectToko = document.getElementById('toko');

        document.addEventListener('DOMContentLoaded', muatDaftarToko);

        function muatDaftarToko() {
            fetch(URL_GOOGLE_SCRIPT)
                .then(res => res.json())
                .then(respons => {
                    if (respons.status === "success") {
                        selectToko.innerHTML = '<option value="">-- Pilih Lokasi Toko --</option>';
                        respons.data.forEach(toko => {
                            const option = document.createElement('option');
                            option.value = toko.kode; // Menggunakan Kode Toko Singkat
                            option.textContent = toko.kode;
                            selectToko.appendChild(option);
                        });
                    } else {
                        selectToko.innerHTML = '<option value="">-- Gagal Memuat Toko --</option>';
                    }
                })
                .catch(err => {
                    console.error("Gagal mengambil data toko:", err);
                    selectToko.innerHTML = '<option value="">-- Gagal Memuat Toko --</option>';
                });
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal akses kamera. Pastikan izin kamera aktif!"); });

        function prosesAbsensi() {
            const nama = document.getElementById('nama').value;
            const tipeAbsen = document.getElementById('tipeAbsen').value;
            const shift = document.getElementById('shift').value;
            const toko = document.getElementById('toko').value;
            const keterangan = document.getElementById('keterangan').value;

            if (!nama || !tipeAbsen || !shift || !toko) {
                alert("Kolom Nama, Tipe Absen, Shift, dan Toko wajib diisi!");
                return;
            }

            statusDiv.innerText = "Mengambil lokasi GPS...";
            document.getElementById('btnAbsen').disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(5);
                        const lon = position.coords.longitude.toFixed(5);
                        const koordinat = `${lat}, ${lon}`;
                        
                        cetakWatermarkDanKirim(nama, tipeAbsen, shift, toko, koordinat, keterangan);
                    },
                    (error) => {
                        alert("Gagal mengambil GPS. Izin lokasi wajib diaktifkan!");
                        document.getElementById('btnAbsen').disabled = false;
                        statusDiv.innerText = "";
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert("Browser tidak mendukung sistem GPS.");
                document.getElementById('btnAbsen').disabled = false;
            }
        }

        function cetakWatermarkDanKirim(nama, tipeAbsen, shift, toko, koordinat, keterangan) {
            statusDiv.innerText = "Memproses foto bukti...";
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            ctx.translate(640, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, 640, 480);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            const waktu = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });
            const teksWatermark = `${waktu} | ${tipeAbsen} | GPS: ${koordinat}`;

            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 430, 640, 50);

            ctx.font = "bold 18px Arial";
            ctx.fillStyle = "yellow";
            ctx.fillText(teksWatermark, 15, 462);

            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);

            statusDiv.innerText = "Mengirim data ke database...";

            fetch(URL_GOOGLE_SCRIPT, {
                method: "POST",
                body: JSON.stringify({
                    nama: nama,
                    tipeAbsen: tipeAbsen,
                    shift: shift,
                    toko: toko,
                    lokasi: koordinat,
                    keterangan: keterangan,
                    foto: fotoBase64
                })
            })
            .then(res => res.json())
            .then(respons => {
                if(respons.status === "success") {
                    statusDiv.innerHTML = "<span style='color:green; font-weight:bold;'>Absen " + tipeAbsen + " Berhasil Dicatat! Terima Kasih.</span>";
                    document.getElementById('nama').value = "";
                    document.getElementById('keterangan').value = "";
                } else {
                    statusDiv.innerHTML = "<span style='color:red; font-weight:bold;'>Gagal: " + respons.message + "</span>";
                }
                document.getElementById('btnAbsen').disabled = false;
            })
            .catch(err => {
                statusDiv.innerHTML = "<span style='color:red; font-weight:bold;'>Terjadi kesalahan jaringan!</span>";
                document.getElementById('btnAbsen').disabled = false;
            });
        }
    </script>
</body>
</html>
