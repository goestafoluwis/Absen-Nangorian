<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Geofencing</title>
    <style>
        /* ==========================================================================
           1. CSS STYLING DASAR & UI (KEMBALI KE VERSI AWAL YANG OKE)
           ========================================================================== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fafafa;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4a90e2;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #3f51b5;
            color: white;
        }
        .btn-primary:hover:not(:disabled) { background-color: #303f9f; }
        
        .btn-camera {
            background-color: #e0e0e0;
            color: #333;
        }
        .btn-camera:hover:not(:disabled) { background-color: #d5d5d5; }
        
        .btn-retake {
            background-color: #f44336;
            color: white;
            display: none;
        }
        .btn-retake:hover:not(:disabled) { background-color: #d32f2f; }

        .btn-superior {
            background-color: transparent;
            color: #3f51b5;
            border: 2px solid #3f51b5;
            margin-top: 20px;
        }
        .btn-superior:hover {
            background-color: #e8eaf6;
        }

        /* Area Kamera */
        #camera-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 10px;
        }
        video { width: 100%; display: block; }
        canvas { display: none; }
        #preview { width: 100%; display: none; border-radius: 8px; }

        /* Pesan Notifikasi */
        .msg-box {
            padding: 12px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .msg-box.success { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .msg-box.error { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

        /* Area Superior (Hidden by default) */
        #superiorArea {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Absensi</h2>
    <div id="msgBox" class="msg-box"></div>

    <!-- FORM UTAMA ABSENSI -->
    <form id="absenForm">
        <div class="form-group">
            <label>Tipe Absen</label>
            <select id="tipeAbsen" onchange="toggleFormInputs()">
                <option value="IN">Absen Masuk (IN)</option>
                <option value="OUT">Absen Pulang (OUT)</option>
                <option value="Day Off">Day Off</option>
                <option value="Cuti">Cuti</option>
            </select>
        </div>

        <div class="form-group">
            <label>NIK Karyawan</label>
            <input type="text" id="nikInput" placeholder="Masukkan NIK Anda" required>
        </div>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaInput" placeholder="Masukkan Nama Lengkap" required>
        </div>

        <div id="extraInputs">
            <div class="form-group">
                <label>Shift</label>
                <select id="shiftInput">
                    <option value="Pagi (Max 09:00)">Pagi (Max 09:00)</option>
                    <option value="Middle">Middle</option>
                    <option value="Siang">Siang</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lokasi Toko</label>
                <select id="tokoInput">
                    <option value="">-- Pilih Toko --</option>
                    <option value="ASMD">ASMD - Plaza Asia Sumedang</option>
                    <option value="XMDG">XMDG - FS Ruko Tanjung</option>
                </select>
            </div>
        </div>

        <!-- Tambahan ID cameraGroup untuk disembunyikan saat Cuti/Day Off -->
        <div class="form-group" id="cameraGroup">
            <label>Verifikasi Wajah (Foto)</label>
            <div id="camera-container">
                <video id="video" autoplay playsinline></video>
                <img id="preview" alt="Hasil Foto">
                <canvas id="canvas"></canvas>
            </div>
            <button type="button" id="btnCapture" class="btn-camera" onclick="takeSnapshot()">📸 Ambil Foto</button>
            <button type="button" id="btnRetake" class="btn-retake" onclick="retakePhoto()">🔄 Ambil Ulang Foto</button>
        </div>

        <div class="form-group">
            <label>Keterangan (Opsional)</label>
            <input type="text" id="keteranganInput" placeholder="Catatan opsional...">
        </div>

        <button type="submit" id="btnSubmit" class="btn-primary">KIRIM ABSENSI</button>
    </form>

    <!-- TOMBOL MENU SUPERIOR / ADMIN -->
    <button type="button" id="btnSuperior" class="btn-superior" onclick="toggleSuperiorMenu()">
        🔒 Masuk Sebagai Superior
    </button>

    <!-- AREA MONITORING SUPERIOR -->
    <div id="superiorArea">
        <h3 style="text-align: center; color: #3f51b5;">Dashboard Superior</h3>
        <p style="text-align: center; font-size: 13px; color: #666;">Silakan masukkan PIN untuk mengakses data monitoring absensi.</p>
        
        <div class="form-group">
            <input type="password" id="pinSuperior" placeholder="Masukkan PIN Superior (Contoh: 1234)">
        </div>
        <button type="button" class="btn-primary" onclick="loginSuperior()">Cek Data Absensi</button>
    </div>
</div>

<script>
    /* ==========================================================================
       1. KONFIGURASI & VARIABEL GLOBAL
       ========================================================================== */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3pkeaiBt_Zph_ZYg00MblpB_3LroTUnZ0jTDr15qNq8z3TAfKiR_gxuUThdn-yhzCKQ/exec"; // GANTI DENGAN LINK WEB APP GAS ANDA
    
    let currentFotoBase64 = null;
    let userGeoLocation = null;
    let videoStream = null;

    const karyawanMap = {
        "12345": "Luwis Goestafo",
        "67890": "Nama Karyawan Lain"
    };

    const tokoList = [
        { kode: "ASMD", "Nama Toko": "Plaza Asia Sumedang", latitude: -6.8353, longitude: 107.928133 },
        { kode: "XMDG", "Nama Toko": "FS Ruko Tanjung", latitude: -6.9061469, longitude: 107.7973664 }
    ];

    /* ==========================================================================
       2. FUNGSI INISIALISASI (KAMERA & FORM)
       ========================================================================== */
    window.onload = () => {
        initCamera();
        document.getElementById('absenForm').addEventListener('submit', handleAbsenSubmit);
        toggleFormInputs(); // Panggil saat awal dimuat
    };

    function toggleFormInputs() {
        const tipe = document.getElementById('tipeAbsen').value;
        const extra = document.getElementById('extraInputs');
        const cameraGroup = document.getElementById('cameraGroup');

        if (tipe === 'IN') {
            extra.style.display = 'block';
            cameraGroup.style.display = 'block';
        } else if (tipe === 'OUT') {
            extra.style.display = 'none';
            cameraGroup.style.display = 'block';
        } else { // Day Off & Cuti
            extra.style.display = 'none';
            cameraGroup.style.display = 'none';
        }
    }

    /* ==========================================================================
       3. LOGIKA KAMERA & FOTO
       ========================================================================== */
    async function initCamera() {
        const video = document.getElementById('video');
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = videoStream;
        } catch (err) {
            console.error("Gagal akses kamera:", err);
            // Tidak perlu alert keras agar tidak ganggu yang mau Day Off
        }
    }

    function takeSnapshot() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const preview = document.getElementById('preview');
        const btnCapture = document.getElementById('btnCapture');
        const btnRetake = document.getElementById('btnRetake');

        if (!videoStream) {
            alert("⚠️ Kamera belum siap atau izin ditolak browser!");
            return;
        }

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        currentFotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
        preview.src = currentFotoBase64;

        video.style.display = 'none';
        preview.style.display = 'block';
        btnCapture.style.display = 'none';
        btnRetake.style.display = 'block';
    }

    function retakePhoto() {
        const video = document.getElementById('video');
        const preview = document.getElementById('preview');
        const btnCapture = document.getElementById('btnCapture');
        const btnRetake = document.getElementById('btnRetake');

        currentFotoBase64 = null;
        preview.style.display = 'none';
        video.style.display = 'block';
        btnRetake.style.display = 'none';
        btnCapture.style.display = 'block';
    }

    /* ==========================================================================
       4. LOGIKA FITUR SUPERIOR / ADMIN
       ========================================================================== */
    function toggleSuperiorMenu() {
        const area = document.getElementById('superiorArea');
        if (area.style.display === 'none' || area.style.display === '') {
            area.style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        } else {
            area.style.display = 'none';
        }
    }

    function loginSuperior() {
        const pin = document.getElementById('pinSuperior').value;
        if (pin === "1234") {
            alert("✅ Login Berhasil! (Di sini Anda bisa mengarahkan ke link Dashboard Data Sheets)");
            // window.location.href = "LINK_DASHBOARD_SPREADSHEET_ANDA";
        } else {
            alert("❌ PIN Salah! Silakan coba lagi.");
        }
    }

    /* ==========================================================================
       5. HELPER GPS & KOORDINAT (DIJAMIN ANTI ERROR)
       ========================================================================== */
    function getCurrentLocationAsync() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    resolve(`${position.coords.latitude}, ${position.coords.longitude}`);
                },
                (error) => {
                    resolve(null);
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    function getStoreLatLng(tokoObj) {
        if (!tokoObj) return null;

        // Antisipasi koma dari Sheet
        function parseCoord(val) {
            if (val === undefined || val === null || val === '') return NaN;
            let strVal = String(val).replace(',', '.').trim();
            return parseFloat(strVal);
        }

        const lat = parseCoord(tokoObj['Latitude'] || tokoObj.latitude || tokoObj.Latitude || tokoObj.lat);
        const lng = parseCoord(tokoObj['Longitude'] || tokoObj.longitude || tokoObj.Longitude || tokoObj.lng);

        if (!isNaN(lat) && !isNaN(lng)) return { lat: lat, lng: lng };

        const lokasiStr = tokoObj['Lokasi'] || tokoObj.lokasi || tokoObj.koordinat || "";
        if (lokasiStr) {
            const parts = String(lokasiStr).split(',').map(n => parseCoord(n));
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                return { lat: parts[0], lng: parts[1] };
            }
        }
        return null;
    }

    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    /* ==========================================================================
       6. LOGIKA UTAMA SUBMIT ABSENSI
       ========================================================================== */
    async function handleAbsenSubmit(e) {
        e.preventDefault();

        const msgBox = document.getElementById('msgBox');
        const btnSubmit = document.getElementById('btnSubmit');
        const tipeAbsen = document.getElementById('tipeAbsen').value;
        const nikInput = document.getElementById('nikInput').value.trim();
        const namaInput = document.getElementById('namaInput').value.trim();

        if (!nikInput || !karyawanMap[nikInput] || namaInput === "") {
            alert("❌ NIK tidak terdaftar! Silakan periksa kembali.");
            document.getElementById('nikInput').focus();
            return;
        }

        // Cek Foto WAJIB jika IN atau OUT
        if ((tipeAbsen === 'IN' || tipeAbsen === 'OUT') && !currentFotoBase64) {
            alert("📸 Silakan ambil foto verifikasi terlebih dahulu!");
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerText = "Mengecek GPS...";

        let freshLocation = await getCurrentLocationAsync();
        if (freshLocation) userGeoLocation = freshLocation;

        if (tipeAbsen === 'IN') {
            if (!userGeoLocation) {
                alert("📍 GPS TIDAK AKTIF / DITOLAK!\n\nMohon aktifkan Lokasi (GPS) di HP Anda dan izinkan akses di browser.");
                resetSubmitButton(btnSubmit);
                return;
            }

            const selectedKode = document.getElementById('tokoInput').value;
            
            // Pencarian toko sudah diperbaiki
            const selectedTokoObj = tokoList.find(t => 
                (t['Nama Toko'] || t.namaToko || t.kode || t.Kode) === selectedKode
            );

            if (!selectedTokoObj) {
                alert("❌ Silakan pilih toko terlebih dahulu!");
                resetSubmitButton(btnSubmit);
                return;
            }

            const storeCoords = getStoreLatLng(selectedTokoObj);
            if (!storeCoords) {
                alert(`⚠️ Data koordinat toko (${selectedKode}) gagal terbaca dari database!`);
                resetSubmitButton(btnSubmit);
                return;
            }

            const userCoords = userGeoLocation.split(',').map(n => parseFloat(n.trim()));
            if (userCoords.length !== 2 || isNaN(userCoords[0]) || isNaN(userCoords[1])) {
                alert("📍 Gagal membaca titik koordinat GPS. Coba refresh halaman.");
                resetSubmitButton(btnSubmit);
                return;
            }

            const distanceMeters = getDistanceFromLatLonInMeters(
                userCoords[0], userCoords[1], storeCoords.lat, storeCoords.lng
            );

            if (distanceMeters > 1000) {
                const distanceKm = (distanceMeters / 1000).toFixed(2);
                alert(`⛔ Lokasi Anda di luar jangkauan!\n\nJarak saat ini: ±${distanceKm} km (${Math.round(distanceMeters)} meter) dari toko.\nBatas maksimum adalah 1 km.`);
                resetSubmitButton(btnSubmit);
                return;
            }
        }

        const payload = {
            nik: nikInput,
            nama: namaInput,
            tipeAbsen: tipeAbsen,
            shift: tipeAbsen === 'IN' ? document.getElementById('shiftInput').value : "-",
            toko: tipeAbsen === 'IN' ? document.getElementById('tokoInput').value : "-",
            foto: currentFotoBase64 || "-",
            lokasi: userGeoLocation || "Gagal mendapatkan lokasi",
            keterangan: document.getElementById('keteranganInput').value.trim()
        };

        try {
            btnSubmit.innerText = "Mengirim Data...";
            msgBox.style.display = "none";

            if(SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE"){
                throw new Error("Tolong ganti SCRIPT_URL dengan link Apps Script Anda!");
            }

            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (result.status === 'success') {
                showMsg("✅ Absensi Berhasil Disimpan!", "success");
                setTimeout(() => { location.reload(); }, 2000); 
            } else {
                throw new Error(result.message || "Gagal menyimpan data absensi.");
            }

        } catch (err) {
            console.error("Error submitting:", err);
            showMsg(`❌ Gagal Mengirim: ${err.message}`, "error");
        } finally {
            resetSubmitButton(btnSubmit);
        }
    }

    function showMsg(message, type) {
        const msgBox = document.getElementById('msgBox');
        msgBox.innerText = message;
        msgBox.className = `msg-box ${type}`;
        msgBox.style.display = 'block';
    }

    function resetSubmitButton(btn) {
        if (btn) {
            btn.disabled = false;
            btn.innerText = "KIRIM ABSENSI";
        }
    }
</script>

</body>
</html>
